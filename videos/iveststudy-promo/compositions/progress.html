      camTo("#pg-win3-cam", 1.4, 720, 480, 7.3, 0.8);
      camTo("#pg-win3-cam", 1.4, 720, 560, 8.1, 1.6, "none");
      tl.to("#pg-win3", { x: 160, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 9.7);
      tl.to("#pg-3 .w, #pg-4 .w, #pg-s, #pg-win-tag", { opacity: 0, duration: 0.25, ease: "power2.in" }, 9.75);
