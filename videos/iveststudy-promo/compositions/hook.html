    <h1 id="hk-2" class="t clip" data-start="2.2" data-duration="3.4" style="top:380px" data-layout-allow-overflow><span class="w">Mas</span><span class="w">sabe</span><span class="w acc">onde</span><span class="w">errou?</span></h1>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      const wordIn = (sel, at) => document.querySelectorAll(sel + " .w").forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, at + i * 0.07));
      const wordOut = (sel, at) => tl.to(sel + " .w", { opacity: 0, filter: "blur(6px)", duration: 0.18, ease: "power2.in", stagger: 0.03 }, at);
      const subIn = (sel, at) => tl.fromTo(sel, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at);
      // camera: scale s on a 1440x900 plate shown in a 1040x650 window, centred on (fx, fy) plate px
      const K = 1100 / 1440;
      const cam = (s, fx, fy) => ({ scale: K * s, x: 550 - fx * K * s, y: 344 - fy * K * s });
      const camSet = (sel, s, fx, fy) => gsap.set(sel, cam(s, fx, fy));
      const camTo = (sel, s, fx, fy, at, dur = 0.6, ease = "power2.inOut") => tl.to(sel, { ...cam(s, fx, fy), duration: dur, ease }, at);
      const camFrom = (sel, s, fx, fy, s2, fx2, fy2, at, dur = 0.6, ease = "power2.inOut") => tl.fromTo(sel, cam(s, fx, fy), { ...cam(s2, fx2, fy2), duration: dur, ease }, at);
      const winIn = (sel, at, fromX = 900) => tl.fromTo(sel, { x: fromX, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" }, at);
      const winOut = (sel, at, toX = 160) => tl.to(sel, { x: toX, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, at);
      const tagIn = (sel, at) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.3 }, at);


      wordIn("#hk-1", 0.3); wordIn("#hk-2", 2.2);
      tl.fromTo("#hk-win", { opacity: 1, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
      tagIn("#hk-win-tag", 0.5);
      // on the answer box while the student types; the timer top-right stays in frame
      camSet("#hk-win-cam", 1.0, 720, 450);
      camTo("#hk-win-cam", 1.55, 800, 560, 0.3, 1.1);
      camTo("#hk-win-cam", 1.55, 800, 600, 1.6, 3.6, "none");
      // hand-off: zoom through the window into the reveal
      tl.to("#hk-1 .w, #hk-2 .w, #hk-win-tag", { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.95);
      tl.to("#hk-win", { scale: 1.06, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in", transformOrigin: "50% 50%" }, 5.2);

      window.__timelines["hook"] = tl;
    })();
